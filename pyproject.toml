[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "breakglass"
version = "0.1.0"
description = "Autonomous red-team security assessment agent"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
breakglass = "breakglass.cli:main"

[project.optional-dependencies]
llm = ["google-generativeai>=0.8.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
